<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS flex-flow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS | flex-flow Property</h1>

    <h2>1. <code>flex-flow: row nowrap;</code> (giá trị mặc định)</h2>
    <p>Các item nằm trên một hàng, sắp xếp từ trái qua phải.</p>
    <div class="container-1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

    <h2>2. <code>flex-flow: row-reverse nowrap;</code></h2>
    <p>Các item nằm trên một hàng, sắp xếp ngược lại từ phải qua trái.</p>
    <div class="container-2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>
</body>
</html>
