<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid - SASS</title>
    <!-- CSS biên dịch từ scss/main.scss -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <!-- Bố cục: header, 2 sidebar, footer -->
    <div class="layout">
        <div class="grid-row grid-row--header">
            <div class="col col-12 header"></div>
        </div>

        <div class="grid-row grid-row--content">
            <div class="col col-3 sidebar">
                <div class="sidebar__item"></div>
                <div class="sidebar__item"></div>
                <div class="sidebar__item"></div>
                <div class="sidebar__item"></div>
            </div>
            <div class="col col-1 spacer"></div>
            <div class="col col-1 spacer"></div>
            <div class="col col-1 spacer"></div>
            <div class="col col-1 spacer"></div>
            <div class="col col-1 spacer"></div>
            <div class="col col-1 spacer"></div>
            <div class="col col-3 sidebar">
                <div class="sidebar__box"></div>
            </div>
        </div>

        <div class="grid-row grid-row--footer">
            <div class="col col-12 footer"></div>
        </div>
    </div>

    <!-- Lưới 12 cột mờ phía sau -->
    <div class="guides">
        <div class="grid-row grid-row--guides">
            <div class="col"></div>
            <div class="col"></div>
            <div class="col"></div>
            <div class="col"></div>
            <div class="col"></div>
            <div class="col"></div>
            <div class="col"></div>
            <div class="col"></div>
            <div class="col"></div>
            <div class="col"></div>
            <div class="col"></div>
            <div class="col"></div>
        </div>
    </div>

    <p>Resize the browser window to see that this grid will respond to the resizing, and always use 100% of the available space.</p>

</body>
</html>
