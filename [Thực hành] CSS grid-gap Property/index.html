<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid-gap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS | grid-gap Property</h1>

    <h2>Ví dụ 1: Thiết lập khoảng cách giữa hàng và cột</h2>
    <p><code>grid-gap: 20px;</code> (hàng và cột đều cách nhau 20px)</p>
    <div class="grid-container example-1">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>

    <h2>Ví dụ 2: Thiết lập khoảng cách hàng và cột khác nhau</h2>
    <p><code>grid-gap: 30px 10px;</code> (hàng cách nhau 30px, cột cách nhau 10px)</p>
    <div class="grid-container example-2">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
    </div>
</body>
</html>
