<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 text-center text-primary fw-bold">Đăng Ký Tài Khoản</h1>
                        <p class="text-center text-muted mb-4">Điền thông tin bên dưới để tạo tài khoản mới</p>

                        <form id="registerForm" class="needs-validation" novalidate>
                            <!-- Họ và tên -->
                            <div class="mb-3">
                                <label for="fullname" class="form-label">Họ và tên</label>
                                <input type="text" class="form-control" id="fullname" placeholder="Nguyễn Văn A" required>
                                <div class="invalid-feedback">Vui lòng nhập họ và tên.</div>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
                                <div class="form-text">Chúng tôi sẽ không chia sẻ email của bạn.</div>
                                <div class="invalid-feedback">Vui lòng nhập email hợp lệ.</div>
                            </div>

                            <!-- Mật khẩu -->
                            <div class="row">
                                <div class="col-12 col-sm-6 mb-3">
                                    <label for="password" class="form-label">Mật khẩu</label>
                                    <input type="password" class="form-control" id="password" minlength="6" required>
                                    <div class="invalid-feedback">Mật khẩu tối thiểu 6 ký tự.</div>
                                </div>
                                <div class="col-12 col-sm-6 mb-3">
                                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                                    <input type="password" class="form-control" id="confirmPassword" required>
                                    <div class="invalid-feedback">Mật khẩu xác nhận không khớp.</div>
                                </div>
                            </div>

                            <!-- Giới tính -->
                            <div class="mb-3">
                                <label class="form-label d-block">Giới tính</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="male" value="nam" required>
                                    <label class="form-check-label" for="male">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="female" value="nu">
                                    <label class="form-check-label" for="female">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="other" value="khac">
                                    <label class="form-check-label" for="other">Khác</label>
                                </div>
                            </div>

                            <!-- Sở thích -->
                            <div class="mb-3">
                                <label class="form-label d-block">Sở thích</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="music" value="am-nhac">
                                    <label class="form-check-label" for="music">Âm nhạc</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="sport" value="the-thao">
                                    <label class="form-check-label" for="sport">Thể thao</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="reading" value="doc-sach">
                                    <label class="form-check-label" for="reading">Đọc sách</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="travel" value="du-lich">
                                    <label class="form-check-label" for="travel">Du lịch</label>
                                </div>
                            </div>

                            <!-- Quốc gia -->
                            <div class="mb-4">
                                <label for="country" class="form-label">Quốc gia</label>
                                <select class="form-select" id="country" required>
                                    <option value="" selected disabled>-- Chọn quốc gia --</option>
                                    <option value="vn">Việt Nam</option>
                                    <option value="us">Hoa Kỳ</option>
                                    <option value="jp">Nhật Bản</option>
                                    <option value="kr">Hàn Quốc</option>
                                    <option value="other">Khác</option>
                                </select>
                                <div class="invalid-feedback">Vui lòng chọn quốc gia.</div>
                            </div>

                            <!-- Submit -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Đăng Ký</button>
                            </div>

                            <p class="text-center text-muted small mt-3 mb-0">
                                Đã có tài khoản? <a href="#">Đăng nhập</a>
                            </p>
                        </form>

                        <div id="successMessage" class="alert alert-success text-center mt-3 d-none">
                            Đăng ký thành công!
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');

        // Kiểm tra mật khẩu xác nhận có khớp không
        function checkPasswordMatch() {
            confirmPassword.setCustomValidity(
                confirmPassword.value === password.value ? '' : 'Mật khẩu không khớp'
            );
        }
        password.addEventListener('input', checkPasswordMatch);
        confirmPassword.addEventListener('input', checkPasswordMatch);

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            checkPasswordMatch();
            form.classList.add('was-validated');
            if (form.checkValidity()) {
                document.getElementById('successMessage').classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
