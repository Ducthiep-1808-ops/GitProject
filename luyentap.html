<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Danh sách sản phẩm</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    table {
      border-collapse: collapse;
      width: 60%;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <h1>Danh sách sản phẩm</h1>

  <table>
    <tr>
      <th>Tên sản phẩm</th>
      <th>Giá</th>
      <th>Số lượng</th>
    </tr>
    <tr>
      <td>Bàn phím cơ</td>
      <td>590.000đ</td>
      <td>15</td>
    </tr>
    <tr>
      <td>Chuột không dây</td>
      <td>250.000đ</td>
      <td>30</td>
    </tr>
    <tr>
      <td>Màn hình 24 inch</td>
      <td>3.350.000đ</td>
      <td>8</td>
    </tr>
    <tr>
      <td>Tai nghe Bluetooth</td>
      <td>450.000đ</td>
      <td>20</td>
    </tr>
  </table>

</body>
</html>
